
<button onclick="document.getElementById('modal')">モーダル開くべ</button>
<button onclick="document.getElementById('nonmodal')">非モーダル開くべ</button>

<dialog id="modal">
    <p>モーダル</p>
    <button onclick="document.getElementById('modal').close()">閉じる</button>
</dialog>

<dialog id="nonmodal">
    <p>非モーダル</p>
    <button onclick="document.getElementById('modal').close()">閉じる</button>
</dialog>
