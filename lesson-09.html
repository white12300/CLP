<dialog id="modal">
    <p>モーダル</p>
    <button onclick="document.getElementById('modal').close()">閉じる</button>
</dialog>

<dialog id="nonmodal">
    <p>非モーダル</p>
    <button onclick="document.getElementById('modal').close()">閉じる</button>
</dialog>

<button onclick="document.getElementById('modal').showmodal()">モーダル開くべ</button>
<button onclick="document.getElementById('nonmodal').show()">非モーダル開くべ</button>
